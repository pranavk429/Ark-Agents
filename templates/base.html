<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Agent Tower{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body>
  <nav class="nav">
    <span class="brand">AGENT&nbsp;TOWER</span>
    <a href="/" class="{% if page=='run' %}on{% endif %}">run</a>
    <a href="/timeline" class="{% if page=='timeline' %}on{% endif %}">timeline</a>
    <a href="/approvals" class="{% if page=='approvals' %}on{% endif %}">approvals</a>
    <a href="/scoreboard" class="{% if page=='scoreboard' %}on{% endif %}">scoreboard</a>
  </nav>
  <main>{% block body %}{% endblock %}</main>
</body>
</html>
